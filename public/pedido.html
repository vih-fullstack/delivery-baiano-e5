<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Ju - Fazer Pedido</title>
</head>
<body>
    <herader>
        <h1> Fazer pedido</h1>
        <nav>
            <Ul>
                <liv><a href="index.html"> Voltar pro cardápio</a></liv>
            </Ul>
        </nav>
    </herader>
    <main>
        <form action="/pedidos" method="post">
            <fieldset>
                <legend>Seu dados</legend>
                <p>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="telefone">Telefone</label>
                    <input type=""tel" id="telefone" name=""telefone" required>
                </p>
            </fieldset>
            <fieldset>
                <legend>Entrega</legend>
                <p>
                    <label for="bairro">Bairro</label>
                    <select id="bairro" name="bairro" required>
                    <option value="rio-vermelho">Rio Vermelho (taxa R$ 5,00)</option>
                    <option value="barra"> Barra (taxa R$ 6,00)</option>
                    <option value="pituba">Pituba (taxa R$ 7,00)</option>
                    <option value="itapua"> Itapuã (taxa R$ 9,00)</option>
                </select>
                </p>
                <p>
                    <label for="endereco">Endereço (rua,número e complemento)<label>
                    <textarea name="endereco" id="endereco" rows="2" required></textarea>
                </p>
            </fieldset>
            <fieldset>
                <loegend>Itens</loegend>
                <p>
                    <label for="qtd-acaraje"> Acarajé (R$ 12,00)</label>
                    <input type="number" id="qtd-acaraje" name="itens[acaraje]" min="0" max="20" value="0">
                </p>

                <p>
                    <label for="qtd-acaraje"> Bobó de camarão (R$ 12,00)</label>
                    <input type="number" id="qtd-bobo" name="itens[bobo]" min="0" max="20" value="0">
                </p>

                <p>
                    <label for="qtd-acaraje"> Muqueca de banana (R$ 28,90)</label>
                    <input type="number" id="qtd-muqueca de banana" name="itens[muqueca de banana" min="0" max="20" value="0">
                </p>

                <p>
                    <label for="qtd-acaraje"> Caruru Baiano (R$ 28,00)</label>
                    <input type="number" id="qtd-caruru" name="itens[caruru]" min="0" max="20" value="0">
                </p>

                <p>
                    <label for="qtd-acaraje"> Moqueca Baiana Peixe (R$ 28,00)</label>
                    <input type="number" id="qtd-moqueca" name="itens[moqueca]" min="0" max="20" value="0">
                </p>

                <p>
                    <label for="qtd-acaraje"> Xinxim de Galinha (R$ 35,00)</label>
                    <input type="number" id="qtd-xinxim" name="itens[xinxim]" min="0" max="20" value="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Pagamento</legend>
                <p>
                    <label for="">Forma de pagamento (na entrega)</label>
                    <select name="forma_pagamento" id="pagamento" required>
                        <option value="">Escolha</option>
                        <option value="dinheiro">Dinheiro</option>
                        <option value="pix">Pix</option>
                    </select>
                </p>
                <p>
                    <label for="cupom">Cupom (opcional)</label>
                    <input type="text" id="cupom" name="cupom" maxlength="20"
                    placeholder="PRIMEIRA10">
                </p>
            </fieldset>
            <button type="submit">Enviar pedido</button>
        </form>
    </main>
    <footer></footer>
</body>
</html>
